services:
  # ─── PostgreSQL ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pagos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pagos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Servicio Python (FastAPI) ─────────────────────
  service-python:
    build:
      context: ./service-python
      dockerfile: Dockerfile
    container_name: pagos-service-python
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── API Node.js (NestJS) ─────────────────────────
  api-node:
    build:
      context: ./api-node
      dockerfile: Dockerfile
    container_name: pagos-api-node
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pagos_db
      PYTHON_SERVICE_URL: http://service-python:8000
      PORT: "3000"
      DOCKER_ENV: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./database:/app/database
    depends_on:
      postgres:
        condition: service_healthy
      service-python:
        condition: service_healthy

volumes:
  postgres_data:
